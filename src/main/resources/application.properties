spring.application.name=accommodation-finder
spring.datasource.url=jdbc:mysql://localhost:3306/accommodation_finder
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.profiles.include=secrets
jwt.refresh-expiration=604800000

# listing images are saved on disk here, only the file name goes in the database
app.upload-dir=uploads/listings
# Spring Boot defaults to 1MB, we allow images up to 2MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Redis runs locally through docker-compose.yml, it stores the login OTPs
spring.data.redis.host=localhost
spring.data.redis.port=6379
# RabbitMQ runs locally through docker-compose.yml, it carries the domain events
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

# @Cacheable results are stored in Redis and expire after 60 seconds (only the admin overview is cached)
spring.cache.type=redis
spring.cache.redis.time-to-live=60s

# a login OTP is deleted from Redis automatically after this many minutes
otp.expiry-minutes=5
# a new OTP email for the same address can only be sent after this many seconds (login and resend share it)
otp.resend-cooldown-seconds=60

# the browser origin that may call the API (the Angular dev server). Change it for production
app.cors.allowed-origin=http://localhost:4200

# the public contact form: where inquiry emails go, and how many one IP address may send per hour
inquiry.support-email=campusnestai@gmail.com
inquiry.max-per-hour=5
# give up quickly when RabbitMQ is down, so a login or booking is never kept waiting
spring.rabbitmq.connection-timeout=5s
# one exchange for all domain events, and one queue per consumer
app.rabbitmq.exchange=accommodation.events
app.rabbitmq.audit-queue=accommodation.audit
app.rabbitmq.notification-queue=accommodation.notifications

# when the rent due reminder job runs (second minute hour day month weekday): every day at 08:00
reminder.cron=0 0 8 * * *

# which payment provider takes the money: simulated (no real money) or mpesa (Daraja sandbox)
payment.provider=mpesa
# Safaricom's Daraja SANDBOX. The keys, shortcode, passkey and callback URL are in application-secrets.properties
daraja.base-url=https://sandbox.safaricom.co.ke
